<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · SV Admin</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fafafa; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 14px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 6px 0 0; letter-spacing: -0.02em; }
      p { margin: 0; color: #a1a1aa; max-width: 320px; line-height: 1.5; font-size: 15px; }
      button { margin-top: 10px; height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #fafafa; color: #0a0a0a; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/app/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>SV Admin needs a connection to load your portfolio data. It'll be right back once you're online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
